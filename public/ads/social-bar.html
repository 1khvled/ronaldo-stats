<script>
/* In-frame popup gate: the sandbox allows popups so genuine creative
  clicks reach the advertiser. Popunders (timers, synthetic events,
  multi-tab sprays) are blocked here — only a real user click may open
  anything, at most one popup per few seconds. Top-page navigation stays
  dead via the sandbox itself (no allow-top-navigation token). */
(function () {
  var lastPopup = 0;
  function trustedEvent() {
    try {
      var e = window.event;
      return !!(e && e.isTrusted);
    } catch (_) { return false; }
  }
  function inLink(el) {
    try {
      while (el) {
        if (el.tagName === 'A' && el.href) return true;
        el = el.parentElement;
      }
    } catch (_) {}
    return false;
  }
  function gate() {
    var now = Date.now();
    if (!trustedEvent()) return false;
    if (now - lastPopup < 5000) return false;
    lastPopup = now;
    return true;
  }
  try {
    var nativeOpen = window.open;
    window.open = function () {
      if (!gate()) return null;
      return nativeOpen.apply(window, arguments);
    };
  } catch (e) {}
  try {
    var ACP = window.HTMLAnchorElement && window.HTMLAnchorElement.prototype;
    if (ACP && ACP.click) {
      var nativeClick = ACP.click;
      ACP.click = function () {
        if (!gate() || !inLink(this)) return;
        return nativeClick.apply(this, arguments);
      };
    }
  } catch (e2) {}
})();
</script>

<script>
/* Sandbox storage shim: ad-network scripts read document.cookie /
  localStorage at init, which throws SecurityError inside a sandboxed
  frame without allow-same-origin and kills rendering before the
  creative is written. Probe real access first so allow-same-origin
  frames keep real cookies & storage (frequency-capping / retargeting),
  falling back to inert stand-ins only when blocked. */
(function () {
  var cookieBlocked = false;
  try { void document.cookie; } catch (_) { cookieBlocked = true; }
  if (cookieBlocked) {
    try {

        set: function () { return true; }
      });

      } catch (e2) {}
    } catch (e2) {}

<script>
/* Social Bar loader: reads ?src= and validates the hostname against an
   explicit allowlist of Adsterra-issued Social Bar script domains.
   Any other src is silently ignored — the owner pastes the Social Bar
   .js URL from src/monetize-config.js and it loads here, isolated. */
(function () {
  var ALLOWED_SRC_HOSTS = [
    'bauval.org',
    'highrevenueformat.com',
    'profitableratecpmnetwork.com'
  ];
  function getSrcParam() {
    try {
      var params = new URLSearchParams(location.search);
      var src = params.get('src');
      if (!src) return null;
      var url = new URL(src);
      var host = url.hostname.toLowerCase();
      for (var i = 0; i < ALLOWED_SRC_HOSTS.length; i++) {
        var allowed = ALLOWED_SRC_HOSTS[i];
        if (host === allowed || host.endsWith('.' + allowed)) return src;
      }
    } catch (_) {}
    return null;
  }
  var src = getSrcParam();
  if (src) {
    var s = document.createElement('script');
    s.src = src;
    document.body.appendChild(s);
  }
})();
</script>
